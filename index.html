  }));
}

async function sendVote(r, v) {
  try {
    await api({ a: "vote", id: r.id, v }); // devuelve el restaurante con el promedio ya actualizado
  } catch {
    toast("No se pudo guardar tu voto. Intenta de nuevo");
    return;
  }
  myVotes[r.slug] = v;
  saveVotes();
  refreshOpenPopup();
  toast("¡Gracias por calificar!");
}

// ===== Cerca de mí =====
// La ubicación se pide solo al tocar el botón, se usa en memoria para calcular distancias
// y nunca se guarda, ni se pone en el enlace, ni se manda a ningún servidor.
let meMarker = null;
const fmtDist = m => m < 950
  ? `${Math.max(50, Math.round(m / 50) * 50)} m`
  : `${(m / 1000).toFixed(m < 9500 ? 1 : 0).replace(".", ",")} km`;

async function showNearMe(me) {
  const icon = L.divIcon({ className: "me", html: "<span></span>", iconSize: [18, 18] });
  if (meMarker) meMarker.setLatLng(me);
  else meMarker = L.marker(me, { icon, interactive: false, keyboard: false, zIndexOffset: 2000 }).addTo(map);

  const withD = state.dots.map(d => ({ id: d.id, d: me.distanceTo([d.lat, d.lng]) })).sort((a, b) => a.d - b.d);
  const radius = [1500, 3000, 6000, 12000].find(R => withD.filter(x => x.d <= R).length >= 5);
  const notes = [];
  let pool = radius ? withD.filter(x => x.d <= radius) : withD.slice(0, 6);
  if (!radius) notes.push("No tienes restaurantes de la lista cerca; estos son los más cercanos.");
  pool = pool.slice(0, 12); // solo se piden los datos de los más cercanos
  const dist = new Map(pool.map(x => [x.id, x.d]));

  if (isSheet()) sheet.snap("mid");
  showLoadingList("Buscando cerca de ti…");
  let places;
  try { places = (await api({ a: "places", ids: pool.map(x => x.id).join(",") })).places; }
  catch { toast("No pude buscar ahora. Intenta de nuevo"); render(false); return; }

  const rows = places
    .sort((a, b) => (b.score ?? -1) - (a.score ?? -1) || dist.get(a.id) - dist.get(b.id))
    .slice(0, 8);
  state.reco = {
    kind: "near", title: "Cerca de ti", text: "", notes, rows, me,
    chips: radius ? [`A menos de ${fmtDist(radius)}`] : [],
    why: r => `A ${fmtDist(dist.get(r.id))}`
  };
  state.results = null;
  state.activeId = null;
  setAddress();
  render(true, true);
  document.getElementById("list").scrollTop = 0;
}

function locate(onPos = showNearMe) {
  const btn = document.getElementById("near");
  if (!navigator.geolocation) { toast("Este navegador no permite usar la ubicación"); return; }
  btn.classList.add("busy");
  navigator.geolocation.getCurrentPosition(
    pos => { btn.classList.remove("busy"); onPos(L.latLng(pos.coords.latitude, pos.coords.longitude)); },
    err => {
      btn.classList.remove("busy");
      toast(err.code === 1 ? "Sin permiso de ubicación. Puedes activarlo en tu navegador" : "No pude obtener tu ubicación. Intenta de nuevo");
    },
    { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 }
  );
}

// Antes de que el navegador pida permiso, se explica para qué es (una sola vez por dispositivo)
async function nearMe(onPos = showNearMe) {
  if (!state.dots.length) return;
  let explained = false, granted = false;
  try { explained = localStorage.getItem("ubicacion-explicada") === "1"; } catch {}
  try { granted = (await navigator.permissions?.query({ name: "geolocation" }))?.state === "granted"; } catch {}
  if (explained || granted) { locate(onPos); return; }
  openDialog(`
    <h2>Restaurantes cerca de ti</h2>
    <p>Tu navegador te va a pedir permiso para usar tu ubicación.</p>
    <p><strong>Solo se usa en este dispositivo</strong> para calcular qué restaurantes tienes cerca. No se guarda ni se envía a ningún lado.</p>`,
    [
      { label: "Ahora no" },
      { label: "Continuar", primary: true, onClick: () => { try { localStorage.setItem("ubicacion-explicada", "1"); } catch {} locate(onPos); } }
    ]);
}
document.getElementById("near").addEventListener("click", () => nearMe());

// ===== Sorpréndeme =====
// Elige al azar uno de los de 9 o más, preferiblemente en la zona que estás viendo en el mapa
async function surprise() {
  if (!state.dots.length) return;
  const btn = document.getElementById("surprise");
  const b = map.getBounds();
  const bbox = [b.getSouth(), b.getWest(), b.getNorth(), b.getEast()].map(n => n.toFixed(4)).join(",");
  const seen = new Set();
  const more = async () => {
    const d = await api({ a: "deck", bbox, not: [...seen].join(",") });
    d.rows.forEach(r => seen.add(r.id));
    return d.rows;
  };
  btn.classList.add("busy");
  let rows = [];
  try { rows = await more(); } catch { toast("No pude elegir ahora. Intenta de nuevo"); }
  btn.classList.remove("busy");
  if (!rows.length) return;
  state.reco = { kind: "surprise", title: "¿Qué tal este?", text: "", chips: [], notes: [], rows };
  state.results = null;
  state.activeId = null;
  setAddress();
  render(true, true);
  openDeck(rows, { title: "¿Qué tal este?", more });
}
document.getElementById("surprise").addEventListener("click", surprise);

// ===== Desliza y decide =====
// Tarjetas de a una: a la derecha "¡Vamos!" (abre el restaurante en el mapa), a la izquierda "Otro".
const deckDlg = document.getElementById("deck");
const deckStack = document.getElementById("deck-stack");
const deck = { rows: [], i: 0, more: null, busy: false };

function cardHTML(r) {
  const c = r.community;
  return `<span class="stamp yes">¡VAMOS!</span><span class="stamp no">OTRO</span>
    ${ringHTML(r)}
    <h3>${esc(r.name)}</h3>
    <p>${esc([r.style, r.city].filter(Boolean).join(", "))}</p>
    ${r.location ? `<p>${esc(r.location)}</p>` : ""}
    ${whyOf(r) ? `<p class="why">${esc(whyOf(r))}</p>` : ""}
    ${c && c.n ? `<p class="comm">Comunidad: ${fmtScore(c.avg)} (${c.n} ${c.n === 1 ? "voto" : "votos"})</p>` : ""}`;
}

function renderDeck() {
  deckStack.innerHTML = "";
  const done = deck.i >= deck.rows.length;
  deckDlg.querySelector(".deck-yes").disabled = done;
  deckDlg.querySelector(".deck-no").disabled = done;
  if (done) {
    deckStack.innerHTML = `<div class="deck-end"><strong>Eso es todo por ahora</strong>
      <span>Puedes ver la lista o volver a empezar.</span>
      <div class="dlg-actions" style="justify-content:center"><button type="button" class="again">Empezar de nuevo</button><button type="button" class="primary list">Ver la lista</button></div></div>`;
    deckStack.querySelector(".again").addEventListener("click", () => { deck.i = 0; renderDeck(); });
    deckStack.querySelector(".list").addEventListener("click", () => deckDlg.close());
    return;
  }
  const next = deck.rows[deck.i + 1];
  if (next) {
    const behind = document.createElement("div");
    behind.className = "card behind";
    behind.innerHTML = cardHTML(next);
    deckStack.appendChild(behind);
  }
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = cardHTML(deck.rows[deck.i]);
  deckStack.appendChild(card);
  dragCard(card);
}

function openDeck(rows, { title = "¿Qué tal este?", more = null } = {}) {
  if (!rows.length) return;
  deck.rows = rows.slice();
  deck.i = 0;
  deck.more = more;
  document.getElementById("deck-title").textContent = title;
  renderDeck();
  if (!deckDlg.open) deckDlg.showModal();
}

// La tarjeta sigue al dedo; al soltarla se decide según hacia dónde iba (posición + impulso)
function dragCard(card) {
  let start = null, x = 0, hist = [];
  const yes = card.querySelector(".stamp.yes"), no = card.querySelector(".stamp.no");
  card.addEventListener("pointerdown", e => {
    if (deck.busy) return;
    start = { x: e.clientX, y: e.clientY };
    hist = [{ t: e.timeStamp, x: e.clientX }];
    x = 0;
    card.setPointerCapture(e.pointerId);
    card.style.transition = "none";
  });
  card.addEventListener("pointermove", e => {
    if (!start) return;
    x = e.clientX - start.x;
    const y = (e.clientY - start.y) * 0.25;
    card.style.transform = `translate(${x}px, ${y}px) rotate(${x / 18}deg)`;
    yes.style.opacity = Math.max(0, Math.min(1, x / 90));
    no.style.opacity = Math.max(0, Math.min(1, -x / 90));
    hist.push({ t: e.timeStamp, x: e.clientX });
    while (hist.length > 2 && e.timeStamp - hist[0].t > 100) hist.shift();
  });
  const end = () => {
    if (!start) return;
    start = null;
    const a = hist[0], b = hist[hist.length - 1];
    const v = b.t > a.t ? ((b.x - a.x) / (b.t - a.t)) * 1000 : 0; // px/s
    const projected = x + v * 0.2;
    if (projected > 110) decide(1);
    else if (projected < -110) decide(-1);
    else {
      card.style.transition = reducedMotion() ? "none" : "transform 0.5s cubic-bezier(0.2, 1.4, 0.4, 1)";
      card.style.transform = "";
      yes.style.opacity = no.style.opacity = 0;
    }
  };
  card.addEventListener("pointerup", end);
  card.addEventListener("pointercancel", end);
}

async function decide(dir) {
  if (deck.busy || deck.i >= deck.rows.length) return;
  deck.busy = true;
  const card = deckStack.querySelector(".card:not(.behind)");
  const r = deck.rows[deck.i];
  if (card && !reducedMotion()) {
    card.querySelector(dir > 0 ? ".stamp.yes" : ".stamp.no").style.opacity = 1;
    card.style.transition = "transform 0.38s cubic-bezier(0.3, 0.7, 0.4, 1), opacity 0.38s";
    card.style.transform = `translate(${dir * 520}px, -30px) rotate(${dir * 22}deg)`;
    card.style.opacity = "0";
    const behind = deckStack.querySelector(".card.behind");
    if (behind) { behind.style.transform = "none"; behind.style.opacity = "1"; }
    await new Promise(res => setTimeout(res, 300));
  }
  deck.busy = false;
  if (dir > 0) { goTo(r); return; }
  deck.i++;
  if (deck.i >= deck.rows.length && deck.more) {
    try {
      const extra = await deck.more();
      deck.rows.push(...extra);
      if (state.reco?.kind === "surprise") { state.reco.rows = deck.rows.slice(); render(false); }
    } catch {}
  }
  renderDeck();
}

// "¡Vamos!": cierra las tarjetas y muestra el restaurante en el mapa con su ficha
function goTo(r) {
  deckDlg.close();
  if (!markers.has(r.id) && state.reco) { state.reco.rows = [r, ...state.reco.rows.filter(x => x.id !== r.id)]; render(false); }
  openRestaurant(r);
}

deckDlg.querySelector(".deck-yes").addEventListener("click", () => decide(1));
deckDlg.querySelector(".deck-no").addEventListener("click", () => decide(-1));
deckDlg.querySelector(".deck-close").addEventListener("click", () => deckDlg.close());
deckDlg.addEventListener("click", e => { if (e.target === deckDlg) deckDlg.close(); });
deckDlg.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") { e.preventDefault(); decide(1); }
  if (e.key === "ArrowLeft") { e.preventDefault(); decide(-1); }
});

// ===== Arma tu plan en 3 toques =====
// Cada opción se traduce a palabras que el recomendador ya entiende
const PLAN_STEPS = [
  { title: "¿Qué se te antoja?", options: [["Carne", "carne"], ["Sushi", "sushi"], ["Pizza", "pizza"], ["Hamburguesa", "hamburguesa"],
    ["Mexicana", "mexicana"], ["Asiática", "asiática"], ["Italiana", "italiana"], ["Mar", "mariscos"], ["Desayuno", "desayuno"],
    ["Café", "café"], ["Dulce", "algo dulce"], ["Lo que sea", ""]] },
  { title: "¿Con quién vas?", options: [["Solo", ""], ["En pareja", "en pareja"], ["Con amigos", "con amigos"], ["En familia", "en familia"], ["A celebrar", "para celebrar"]] },
  { title: "¿Dónde?", options: [["Cerca de mí", "@cerca"], ["Bogotá", "en Bogotá"], ["Medellín", "en Medellín"], ["Cali", "en Cali"], ["Cartagena", "en Cartagena"], ["Donde sea", ""]] }
];
const planDlg = document.getElementById("plan");
let plan = { step: 0, picks: [] };

function openPlan() {
  if (!state.dots.length) return;
  plan = { step: 0, picks: [] };
  renderPlan(1);
  planDlg.showModal();
}

function renderPlan(dir) {
  const st = PLAN_STEPS[plan.step];
  planDlg.innerHTML = `
    <div class="plan-head">
      <button type="button" class="icon-btn plan-back" aria-label="Atrás" style="visibility:${plan.step ? "visible" : "hidden"}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
      <span>Paso ${plan.step + 1} de ${PLAN_STEPS.length}</span>
      <button type="button" class="icon-btn plan-close" aria-label="Cerrar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="plan-body${dir < 0 ? " back" : ""}">
      <h2>${st.title}</h2>
      <div class="plan-grid">${st.options.map(([label, q], i) =>
        `<button type="button" data-i="${i}"${q === "@cerca" ? ' class="near"' : ""}>${esc(label)}</button>`).join("")}</div>
    </div>
    <div class="plan-dots">${PLAN_STEPS.map((_, i) => `<i class="${i === plan.step ? "on" : i < plan.step ? "done" : ""}"></i>`).join("")}</div>`;
  planDlg.querySelector(".plan-close").addEventListener("click", () => planDlg.close());
  planDlg.querySelector(".plan-back").addEventListener("click", () => { plan.step--; plan.picks.pop(); renderPlan(-1); });
  planDlg.querySelectorAll(".plan-grid button").forEach(b => b.addEventListener("click", () => {
    plan.picks[plan.step] = st.options[Number(b.dataset.i)];
    if (plan.step < PLAN_STEPS.length - 1) { plan.step++; renderPlan(1); }
    else finishPlan();
  }));
}
planDlg.addEventListener("click", e => { if (e.target === planDlg) planDlg.close(); });

async function finishPlan() {
  planDlg.close();
  const [[, antojo], [, quien], [, donde]] = plan.picks;
  const near = donde === "@cerca";
  // Sin antojo ni ocasión, se muestran los mejor calificados
  const query = [antojo, quien, near ? "" : donde].filter(Boolean).join(" ") || "algo especial";
  document.getElementById("ask-q").value = query;
  syncAskClear();
  if (near) { nearMe(me => planNear(query, me)); return; }
  await ask(query);
  if (state.reco?.rows.length) openDeck(state.reco.rows, { title: "Tu plan" });
}

// El plan con "Cerca de mí": el celular elige los restaurantes cercanos y solo envía sus códigos
async function planNear(query, me) {
  const icon = L.divIcon({ className: "me", html: "<span></span>", iconSize: [18, 18] });
  if (meMarker) meMarker.setLatLng(me);
  else meMarker = L.marker(me, { icon, interactive: false, keyboard: false, zIndexOffset: 2000 }).addTo(map);
  const withD = state.dots.map(d => ({ id: d.id, d: me.distanceTo([d.lat, d.lng]) })).sort((a, b) => a.d - b.d);
  const nearby = withD.filter(x => x.d <= 12000).slice(0, 40);
  const pool = nearby.length >= 3 ? nearby : withD.slice(0, 12);
  const dist = new Map(pool.map(x => [x.id, x.d]));
  if (isSheet()) sheet.snap("mid");
  showLoadingList("Armando tu plan…");
  let d;
  try { d = await api({ a: "ask", q: query, ids: pool.map(x => x.id).join(",") }); }
  catch { toast("No pude responder ahora. Intenta de nuevo"); render(false); return; }
  const notes = nearby.length >= 3 ? d.notes : ["No tienes restaurantes de la lista cerca; estos son los más cercanos.", ...d.notes];
  state.reco = {
    kind: "near", title: "Tu plan cerca de ti", text: "", notes, rows: d.rows, me,
    chips: ["Cerca de ti", ...d.chips],
    why: r => [dist.has(r.id) ? `A ${fmtDist(dist.get(r.id))}` : "", r.why].filter(Boolean).join(", ")
  };
  state.results = null;
  state.activeId = null;
  setAddress();
  render(true, true);
  if (d.rows.length) openDeck(d.rows, { title: "Tu plan" });
}
document.getElementById("plan-open").addEventListener("click", openPlan);
