<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis restaurantes</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root {
    --bg: #F3F5F2;
    --panel: #FFFFFF;
    --ink: #1C2420;
    --muted: #5F6B65;
    --line: #DCE2DD;
    --chip: #E7ECE8;
    --accent: #1E6B47;
    --s-top: #1E6B47;
    --s-good: #5E9634;
    --s-mid: #D39A1C;
    --s-low: #9A6A5E;
    --s-none: #9AA39E;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141916;
      --panel: #1B221E;
      --ink: #E8EDE9;
      --muted: #9DA9A2;
      --line: #2C3631;
      --chip: #26302B;
      --accent: #5CC08C;
      --s-top: #3FA873;
      --s-good: #7DB54F;
      --s-mid: #E0AD3A;
      --s-low: #B98576;
      --s-none: #6E7872;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.4;
  }
  #app { display: flex; height: 100%; }
  #panel {
    width: 400px; flex-shrink: 0;
    display: flex; flex-direction: column;
    background: var(--panel);
    border-right: 1px solid var(--line);
    min-height: 0;
  }
  #map { flex: 1; min-height: 0; background: var(--bg); }

  header { padding: 22px 20px 14px; }
  h1 { margin: 0; font-size: 2rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; }
  #status { margin: 6px 0 0; color: var(--muted); font-size: 0.9rem; }
  #status button {
    font: inherit; color: var(--accent); background: none; border: 0; padding: 0;
    text-decoration: underline; cursor: pointer;
  }

  .ask { padding: 0 20px 14px; display: grid; gap: 7px; }
  .ask label { font-weight: 600; font-size: 0.95rem; }
  .ask input {
    flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px;
  }
  .ask button[type=submit] {
    font: inherit; font-weight: 600; white-space: nowrap; cursor: pointer;
    background: var(--accent); color: var(--panel); border: 0; border-radius: 10px; padding: 9px 14px;
  }
  .examples { display: flex; flex-wrap: wrap; gap: 6px; }
  .examples button {
    font: inherit; font-size: 0.8rem; cursor: pointer; color: var(--ink);
    background: var(--chip); border: 0; border-radius: 999px; padding: 4px 10px;
  }
  .examples button:hover { background: var(--line); }

  .reco-head { padding: 14px 20px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
  .reco-head h2 { margin: 0; font-size: 1.1rem; font-weight: 800; }
  .reco-head .back {
    justify-self: start; font: inherit; font-size: 0.88rem; cursor: pointer;
    color: var(--accent); background: none; border: 0; padding: 0; text-decoration: underline;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips span { font-size: 0.8rem; background: var(--chip); border-radius: 999px; padding: 3px 10px; }
  .note { margin: 0; font-size: 0.85rem; color: var(--muted); }
  .why { margin: 3px 0 0; font-size: 0.82rem; color: var(--accent); font-weight: 600; }

  .controls { padding: 0 20px 12px; display: grid; gap: 10px; }
  .controls[hidden], .examples[hidden] { display: none; }
  .row { display: flex; gap: 8px; }
  input[type=search], select {
    font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px;
  }
  input[type=search] { flex: 1; min-width: 0; }
  input:focus-visible, select:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .filters label { display: grid; gap: 3px; font-size: 0.8rem; color: var(--muted); min-width: 0; }
  .filters select { width: 100%; min-width: 0; }
  .filters select.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  #clear {
    justify-self: start; font: inherit; font-size: 0.88rem; cursor: pointer;
    color: var(--accent); background: none; border: 0; padding: 0; text-decoration: underline;
  }

  #list { flex: 1; overflow-y: auto; border-top: 1px solid var(--line); min-height: 0; }
  .item {
    display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 12px; align-items: center;
    width: 100%; text-align: left; font: inherit; color: inherit;
    background: none; border: 0; border-bottom: 1px solid var(--line);
    padding: 12px 20px; cursor: pointer;
  }
  .item:hover { background: var(--bg); }
  .item.active { background: var(--chip); }
  .score {
    width: 52px; height: 52px; border-radius: 50%;
    display: grid; place-items: center;
    font-size: 1.25rem; font-weight: 800; color: #fff; letter-spacing: -0.02em;
  }
  .name { font-weight: 600; font-size: 1.02rem; margin: 0; }
  .meta { margin: 2px 0 0; color: var(--muted); font-size: 0.88rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nopin { margin: 3px 0 0; font-size: 0.8rem; color: var(--s-low); }
  .empty { padding: 28px 20px; color: var(--muted); }
  .empty strong { color: var(--ink); display: block; margin-bottom: 4px; }
  .empty button {
    margin-top: 12px; font: inherit; cursor: pointer;
    background: var(--ink); color: var(--panel); border: 0; border-radius: 10px; padding: 8px 14px;
  }

  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--panel); color: var(--ink); }
  .leaflet-popup-content { font-family: inherit; margin: 12px 14px; }
  .pop h3 { margin: 0 0 4px; font-size: 1.05rem; }
  .pop p { margin: 0 0 3px; color: var(--muted); font-size: 0.88rem; }
  .pop a { color: var(--accent); font-weight: 600; }

  /* Pines con el puntaje y grupos de pines */
  .pin, .cluster { background: none; border: 0; }
  .pin span, .cluster span {
    display: grid; place-items: center; width: 100%; height: 100%;
    border-radius: 50%; font-family: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    font-weight: 800; line-height: 1; letter-spacing: -0.02em;
  }
  .pin span {
    color: #fff; font-size: 12px; border: 2px solid #fff;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
  }
  .cluster span {
    /* El mapa base siempre es claro, así que el grupo va oscuro en ambos temas */
    background: #1C2420; color: #fff; font-size: 13px;
    box-shadow: 0 0 0 5px rgba(28, 36, 32, 0.22);
  }

  @media (max-width: 760px) {
    #app { flex-direction: column; }
    #map { flex: 0 0 42vh; flex: 0 0 42dvh; }
    #panel { width: 100%; flex: 1; border-right: 0; border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
    header { padding: 14px 16px 10px; }
    h1 { font-size: 1.5rem; }
    .ask { padding: 0 16px 12px; }
    .reco-head { padding: 12px 16px; }
    .controls { padding: 0 16px 10px; }
    .item { padding: 10px 16px; }
  }
</style>
</head>
<body>
<div id="app">
  <aside id="panel">
    <header>
      <h1>Mis restaurantes</h1>
      <p id="status">Cargando la hoja…</p>
    </header>
    <form id="ask" class="ask" autocomplete="off">
      <label for="ask-q">¿Qué se te antoja?</label>
      <div class="row">
        <input type="text" id="ask-q" placeholder="Ej: sushi, presupuesto de 80 mil">
        <button type="submit">Recomiéndame</button>
      </div>
      <div class="examples" aria-label="Ejemplos">
        <button type="button">Sushi hasta 80 mil</button>
        <button type="button">Algo dulce en Bogotá</button>
        <button type="button">Carne para 4 con 300 mil</button>
        <button type="button">Algo especial para una cita</button>
      </div>
    </form>
    <div class="controls">
      <input type="search" id="q" placeholder="Busca por nombre o dirección" aria-label="Buscar restaurantes">
      <div class="filters">
        <label>Ciudad
          <select id="f-city"><option value="">Todas</option></select>
        </label>
        <label>Tipo de comida
          <select id="f-style"><option value="">Todos</option></select>
        </label>
        <label>Puntaje
          <select id="f-score">
            <option value="">Cualquiera</option>
            <option value="10">Solo 10</option>
            <option value="9">9 o más</option>
            <option value="8">8 o más</option>
            <option value="7">7 o más</option>
            <option value="-7">Menos de 7</option>
          </select>
        </label>
        <label>Ordenar por
          <select id="sort">
            <option value="score">Mejor puntaje</option>
            <option value="name">Nombre A–Z</option>
            <option value="city">Ciudad</option>
          </select>
        </label>
      </div>
      <button type="button" id="clear" hidden>Quitar filtros</button>
    </div>
    <div id="list" aria-live="polite"></div>
  </aside>
  <div id="map" role="region" aria-label="Mapa de restaurantes"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
<script>
// ===== Configuración =====
// URL de la hoja publicada como CSV (Archivo → Compartir → Publicar en la web → CSV)
const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vStf526UD4ugy9VWSJdkMZRFndOHLKgRnyJHVYH8fv8v4--9QBx6bifwtFIsZmycvege-2WdaR6OV1I/pub?output=csv";
const PROXY = url => "https://api.allorigins.win/raw?url=" + encodeURIComponent(url);
const START_VIEW = [4.665, -74.06]; // Bogotá

// ===== Utilidades =====
const norm = s => (s ?? "").toString().normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nums = s => ((s ?? "").toString().match(/-?\d+(?:[.,]\d+)?/g) || []).map(n => parseFloat(n.replace(",", ".")));

// Lee una columna sin importar mayúsculas ni tildes en el encabezado
function col(row, ...names) {
  for (const key of Object.keys(row)) {
    if (names.includes(norm(key))) return (row[key] ?? "").toString().trim();
  }
  return "";
}

function tier(score) {
  if (score == null) return "var(--s-none)";
  if (score >= 9) return "var(--s-top)";
  if (score >= 8) return "var(--s-good)";
  if (score >= 7) return "var(--s-mid)";
  return "var(--s-low)";
}
function fmtScore(score) {
  if (score == null) return "–";
  return Number.isInteger(score) ? String(score) : score.toFixed(1).replace(".", ",");
}

// ===== Mapa =====
// CARTO exige clave para sus mapas base
const CARTO_KEY = "cb1_4na0_1_97ca5fd991ca6b67f507fe2e";
const map = L.map("map", { zoomControl: true }).setView(START_VIEW, 12);
L.tileLayer(`https://basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png?key=${CARTO_KEY}`, {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>'
}).addTo(map);
// Si el contenedor cambia de tamaño (girar el móvil, etc.), el mapa se recalcula
new ResizeObserver(() => map.invalidateSize()).observe(document.getElementById("map"));

// Agrupa los pines cercanos; los que comparten coordenadas se abren en abanico al hacer clic
const layer = L.markerClusterGroup({
  maxClusterRadius: 40,
  showCoverageOnHover: false,
  spiderfyOnMaxZoom: true,
  iconCreateFunction: c => {
    const n = c.getChildCount();
    const size = n < 10 ? 34 : n < 50 ? 40 : 46;
    return L.divIcon({ className: "cluster", html: `<span>${n}</span>`, iconSize: [size, size] });
  }
}).addTo(map);

const pinIcon = r => L.divIcon({
  className: "pin",
  html: `<span style="background:${tier(r.score)}">${fmtScore(r.score)}</span>`,
  iconSize: [32, 32],
  popupAnchor: [0, -14]
});

// Encuadra la zona con más restaurantes (radio de 25 km) en lugar del mundo entero
function fitView(rows) {
  const pts = rows.filter(r => r.lat != null).map(r => L.latLng(r.lat, r.lng));
  if (!pts.length) return;
  let group = pts;
  if (pts.length > 1) {
    let best = [];
    for (const p of pts) {
      const near = pts.filter(q => p.distanceTo(q) <= 25000);
      if (near.length > best.length) best = near;
    }
    if (best.length > 1) group = best;
  }
  map.fitBounds(L.latLngBounds(group), { padding: [40, 40], maxZoom: 15 });
}

// ===== Estado =====
const state = { all: [], city: "", style: "", score: "", q: "", sort: "score", activeId: null, reco: null };
const markers = new Map();
let pendingFly = null;

// ===== Datos =====
function parseRow(row, i) {
  const name = col(row, "restaurante", "nombre");
  if (!name) return null;

  let location = col(row, "ubicacion", "direccion");
  const city = col(row, "ciudad");
  if (city && !norm(location).includes(norm(city))) location = location ? `${location}, ${city}` : city;

  let lat = nums(col(row, "lat", "latitud"))[0];
  let lng = nums(col(row, "lng", "lon", "long", "longitud"))[0];
  if (!(Number.isFinite(lat) && Number.isFinite(lng))) {
    const c = nums(col(row, "coordenadas", "coords"));
    lat = c[0]; lng = c[1];
  }
  const hasPin = Number.isFinite(lat) && Number.isFinite(lng) && Math.abs(lat) <= 90 && Math.abs(lng) <= 180;

  const s = nums(col(row, "puntaje", "calificacion", "nota"))[0];
  const style = col(row, "estilo", "tipo");

  // Columna opcional de precio por persona: "60000", "60.000", "60 mil" o "$$"
  const priceRaw = col(row, "precio", "precio por persona", "costo", "valor", "rango de precio");
  let price = null, priceLevel = null;
  if (/^\s*\$+\s*$/.test(priceRaw)) priceLevel = Math.min(priceRaw.trim().length, 4);
  else if (priceRaw) price = parseMoney(norm(priceRaw), true);

  return {
    id: i,
    name,
    style,
    tags: style.split(/[,/|]+|\s+-\s*|\s*-\s+/).map(t => t.trim().replace(/[.\s-]+$/, "")).filter(Boolean),
    city: (city.split(",")[0] || "").trim(),
    location,
    score: Number.isFinite(s) ? s : null,
    lat: hasPin ? lat : null,
    lng: hasPin ? lng : null,
    price,
    priceLevel,
    styleN: norm(style),
    nameN: norm(name),
    search: norm(`${name} ${style} ${location}`)
  };
}

// Convierte "80 mil", "80k", "80 lucas", "$80.000" o "80000" en pesos.
// Con assumeMoney, un número suelto pequeño (p. ej. "80") se lee como miles.
function parseMoney(t, assumeMoney) {
  const m = t.match(/(\$\s*)?(\d{1,3}(?:\.\d{3})+|\d+(?:,\d+)?)\s*(mil\b|k\b|lucas?\b|pesos\b|cop\b)?/);
  if (!m) return null;
  let n = /\.\d{3}/.test(m[2]) ? Number(m[2].replace(/\./g, "")) : parseFloat(m[2].replace(",", "."));
  if (/^(mil|k|luca)/.test(m[3] || "")) n *= 1000;
  else if (n < 1000 && (assumeMoney || m[1] || m[3])) n *= 1000;
  return Number.isFinite(n) && n > 0 ? Math.round(n) : null;
}
const fmtMoney = n => "$" + Math.round(n).toLocaleString("es-CO");

// ===== Recomendador =====
// Palabras que la persona puede escribir → tipos de comida de la hoja
const CRAVINGS = [
  { label: "japonesa", keys: ["sushi", "japon", "ramen", "maki", "nikkei"], tags: ["japonesa", "nikkon", "nikkei", "sushi"] },
  { label: "asiática", keys: ["asiatic", "oriental", "wok", "thai", "tailandes"], tags: ["asiatica", "china", "coreana", "japonesa", "thai"] },
  { label: "coreana", keys: ["corea"], tags: ["coreana"] },
  { label: "china", keys: ["chin", "arroz chino", "chow"], tags: ["china", "asiatica"] },
  { label: "pizza", keys: ["pizza"], tags: ["pizza", "pizzeria"] },
  { label: "italiana", keys: ["pasta", "italian", "lasagna", "risotto"], tags: ["italiana", "pizzeria"] },
  { label: "hamburguesa", keys: ["hamburgues", "burger", "burguer"], tags: ["hamburguesa", "americana"] },
  { label: "carne", keys: ["carne", "asado", "parrilla", "steak", "res=", "costilla", "bbq", "barbecue", "churrasco", "picanha"], tags: ["parrillada", "steakhouse", "asadero", "llanera", "barbecue", "bbq"] },
  { label: "pollo", keys: ["pollo", "alitas", "wings"], tags: ["pollo", "alitas"] },
  { label: "mar", keys: ["mar=", "pescado", "marisco", "ceviche", "camaron", "pulpo"], tags: ["mar=", "pescaderia", "ceviche", "peruana"] },
  { label: "mexicana", keys: ["mexic", "taco", "burrito", "nacho", "quesadilla"], tags: ["mexicana"] },
  { label: "dulce", keys: ["dulce", "postre", "torta", "pastel", "helado", "chocolate", "waffle", "crepe"], tags: ["postre", "pasteleria", "heladeria", "panaderia", "chocolat"] },
  { label: "café", keys: ["cafe", "tinto", "capuchino", "onces"], tags: ["cafe", "coffee", "panaderia"] },
  { label: "desayuno", keys: ["desayun", "brunch", "huevos", "calentado"], tags: ["desayuno", "brunch"] },
  { label: "árabe", keys: ["arabe", "shawarma", "falafel", "kebab"], tags: ["arabe"] },
  { label: "india", keys: ["india", "hindu", "curry"], tags: ["hindu", "indio", "india"] },
  { label: "peruana", keys: ["peru"], tags: ["peruana", "ceviche", "nikkon"] },
  { label: "francesa", keys: ["frances", "francia"], tags: ["frances"] },
  { label: "española", keys: ["espanol", "tapas", "paella"], tags: ["espanola", "catalana", "flamenco"] },
  { label: "mediterránea", keys: ["mediterrane", "grieg"], tags: ["mediterranea"] },
  { label: "colombiana", keys: ["colombian", "bandeja", "corrientazo", "ajiaco", "llaner", "tipic"], tags: ["colombiana", "llanera", "campestre", "asadero"] },
  { label: "picar", keys: ["picar", "picada", "frito", "empanada", "pasabocas"], tags: ["picadas", "fritos", "bocatas", "alitas"] },
  { label: "bar", keys: ["bar=", "cerveza", "trago", "coctel", "rumba", "karaoke"], tags: ["bar=", "gastro-bar", "karaoke", "flamenco"] },
  { label: "saludable", keys: ["saludable", "sano", "ensalada", "bowl", "fit="], tags: ["bowl"] }
];
const STOP = new Set(("tengo ganas quiero comer algo rico rica bueno buena para somos personas persona pesos " +
  "presupuesto hasta maximo unos unas como donde cerca esta este noche almuerzo cena comida lugar sitio " +
  "restaurante gastar plata lucas especial cita aniversario celebrar barato barata economico economica " +
  "pareja amigos familia mejor mejores").split(" "));
const NUM_WORDS = { dos: 2, tres: 3, cuatro: 4, cinco: 5, seis: 6, siete: 7, ocho: 8, diez: 10 };
const LEVEL_MIN = [0, 0, 35000, 70000, 150000]; // piso de cada nivel $, $$, $$$, $$$$
const wordStart = (hay, w, exact) =>
  new RegExp(`(^|[^a-z0-9])${w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}${exact ? "(?![a-z0-9])" : ""}`).test(hay);
// Un término que termina en "=" debe ser palabra completa ("bar=" no casa con "barato")
const hasTerm = (hay, k) => k.endsWith("=") ? wordStart(hay, k.slice(0, -1), true) : wordStart(hay, k);

function understand(text) {
  let t = norm(text).replace(/\b(dos|tres|cuatro|cinco|seis|siete|ocho|diez)\b/g, w => NUM_WORDS[w]);
  const q = { cravings: [], words: [], city: null, budget: null, people: null, cheap: false, special: false };

  // Personas: "para 4", "somos 3", "en pareja"
  const pm = t.match(/(?:para|somos)\s+(\d{1,2})(?!\s*(?:mil|k\b|lucas?|pesos|\.\d{3}|\d))/);
  if (pm) { q.people = Number(pm[1]); t = t.replace(pm[0], " "); }
  else if (/\b(pareja|cita)\b/.test(t)) q.people = 2;

  // Presupuesto: solo números con pinta de plata
  const money = t.match(/(?:\$\s*\d[\d.,]*|\d[\d.,]*\s*(?:mil\b|k\b|lucas?\b|pesos\b|cop\b)|\d{1,3}(?:\.\d{3})+|\d{4,})/)
    || t.match(/(?:presupuesto|hasta|maximo|gastar|tengo)\D{0,12}(\d+)/);
  if (money) {
    q.budget = parseMoney(money[0], true);
    t = t.replace(money[0], " ");
    const perPerson = /por persona|cada uno|c\/u|por cabeza/.test(t);
    if (q.budget && q.people > 1 && !perPerson) { q.total = q.budget; q.budget = Math.round(q.budget / q.people); }
  }
  q.cheap = /\b(barat|economic|poca plata|sin gastar)/.test(t);
  q.special = /\b(especial|aniversario|cita|celebr|cumple|romantic|elegante|lujo)/.test(t);

  // Ciudad: la más larga que aparezca en el texto
  const cities = [...new Set(state.all.map(r => norm(r.city)).filter(Boolean))].sort((a, b) => b.length - a.length);
  q.city = cities.find(c => wordStart(t, c, true)) || null;
  if (q.city) t = t.replace(q.city, " ");

  for (const g of CRAVINGS) if (g.keys.some(k => hasTerm(t, k))) q.cravings.push(g);

  // Palabras sueltas que coinciden con un tipo de comida o nombre de la hoja ("crepes", "Bruce")
  const used = q.cravings.flatMap(g => g.keys.map(k => k.replace(/=$/, "")));
  for (const w of t.split(/[^a-z0-9]+/)) {
    if (w.length < 4 || STOP.has(w) || /^\d/.test(w) || used.some(k => w.startsWith(k))) continue;
    if (state.all.some(r => wordStart(r.styleN, w) || wordStart(r.nameN, w))) q.words.push(w);
  }
  return q;
}

function mostCommonCity() {
  const n = new Map();
  for (const r of state.all) { const c = norm(r.city); if (c) n.set(c, (n.get(c) || 0) + 1); }
  return [...n.entries()].sort((a, b) => b[1] - a[1])[0]?.[0] ?? null;
}

function fitsBudget(r, budget) {
  if (r.price != null) return r.price <= budget * 1.1;
  if (r.priceLevel != null) return LEVEL_MIN[r.priceLevel] <= budget;
  return null; // sin dato
}

function recommend(text) {
  const q = understand(text);
  const hasPrice = state.all.some(r => r.price != null || r.priceLevel != null);
  const chips = [], notes = [];
  let rows = state.all.slice();

  const tags = q.cravings.flatMap(g => g.tags);
  if (tags.length || q.words.length) {
    q.cravings.forEach(g => chips.push(cap(g.label)));
    q.words.forEach(w => chips.push(`“${w}”`));
    rows = rows.filter(r => tags.some(tg => hasTerm(r.styleN, tg)) || q.words.some(w => wordStart(r.styleN, w) || wordStart(r.nameN, w)));
  }
  if (q.city) {
    const cityName = cap(state.all.find(r => norm(r.city).includes(q.city)).city);
    chips.push(cityName);
    const inCity = rows.filter(r => norm(r.city).includes(q.city));
    if (inCity.length || !rows.length) rows = inCity;
    else notes.push(`No tienes de eso en ${cityName}; estos son de otras ciudades.`);
  }

  let budget = q.budget;
  if (!budget && q.cheap) budget = 35000;
  if (q.people) chips.push(`${q.people} personas`);
  if (budget) {
    chips.push(q.total ? `${fmtMoney(q.total)} en total (${fmtMoney(budget)} c/u)` : `hasta ${fmtMoney(budget)} por persona`);
    if (!hasPrice) {
      notes.push("Tu hoja todavía no tiene precios, así que no pude filtrar por presupuesto. Agrega una columna «Precio» con el valor por persona (por ejemplo 60000) o con $, $$, $$$.");
    } else {
      const inBudget = rows.filter(r => fitsBudget(r, budget) !== false);
      if (inBudget.length) rows = inBudget;
      else if (rows.length) notes.push("Nada entra en ese presupuesto; estos son los más cercanos.");
    }
  }
  if (q.special) {
    chips.push("algo especial");
    const top = rows.filter(r => (r.score ?? 0) >= 9);
    if (top.length >= 3) rows = top;
  }

  const understood = chips.length > 0;
  if (!understood) notes.push("No reconocí un antojo; te muestro los mejor puntuados. Prueba con un tipo de comida, un plato o una ciudad.");
  if (understood && !rows.length) notes.push("No encontré nada con eso en tu hoja. Prueba con otro antojo o quita la ciudad.");

  // Orden: primero los que tienen precio dentro del presupuesto; si no se nombró ciudad,
  // primero la ciudad con más restaurantes; luego por puntaje, y los empates al azar
  // para que pedir otra vez muestre opciones distintas
  const home = q.city ? null : mostCommonCity();
  const rnd = new Map(rows.map(r => [r.id, Math.random()]));
  rows.sort((a, b) =>
    (budget && hasPrice ? (fitsBudget(a, budget) === true ? 0 : 1) - (fitsBudget(b, budget) === true ? 0 : 1) : 0) ||
    (home ? (norm(a.city) === home ? 0 : 1) - (norm(b.city) === home ? 0 : 1) : 0) ||
    (b.score ?? -1) - (a.score ?? -1) || rnd.get(a.id) - rnd.get(b.id));

  const why = r => {
    if (r.price != null) return `~${fmtMoney(r.price)} por persona`;
    if (r.priceLevel != null) return "$".repeat(r.priceLevel);
    if (budget && hasPrice) return "Sin precio en la hoja";
    return "";
  };
  return { text, chips, notes, rows: rows.slice(0, 6), why };
}

async function fetchCSV() {
  const bust = (SHEET_URL.includes("?") ? "&" : "?") + "t=" + Date.now();
  try {
    const r = await fetch(SHEET_URL + bust, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    return await r.text();
  } catch (e) {
    // Respaldo: proxy público, por si el navegador bloquea la lectura directa
    const r = await fetch(PROXY(SHEET_URL + bust), { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    return await r.text();
  }
}

async function load() {
  setStatus("Cargando la hoja…");
  try {
    const text = await fetchCSV();
    if (/^\s*<!doctype html|<html/i.test(text)) throw new Error("La URL no devuelve un CSV");
    const { data: grid } = Papa.parse(text, { skipEmptyLines: true });
    // La fila de encabezados es la que dice "Restaurante", esté donde esté
    const h = grid.findIndex(r => r.some(c => ["restaurante", "nombre"].includes(norm(c))));
    if (h < 0) throw new Error("No se encontró la fila de encabezados");
    const headers = grid[h];
    const rows = grid.slice(h + 1).map(r => Object.fromEntries(headers.map((k, i) => [k || `col${i}`, r[i] ?? ""])));
    state.all = rows.map(parseRow).filter(Boolean);
    if (state.reco) state.reco = recommend(state.reco.text);
    buildFilters();
    render(true);
    const time = new Date().toLocaleTimeString("es-CO", { hour: "numeric", minute: "2-digit" });
    state.loadedAt = time;
    updateStatus();
  } catch (err) {
    console.error(err);
    setStatus("No se pudo leer la hoja.");
    document.getElementById("list").innerHTML = `
      <div class="empty">
        <strong>No se pudo leer la hoja de Google.</strong>
        Revisa que siga publicada en la web como CSV y que la URL del código sea la correcta.
        <br><button type="button" onclick="load()">Reintentar</button>
      </div>`;
  }
}

// ===== Interfaz =====
function setStatus(html) { document.getElementById("status").innerHTML = html; }

function updateStatus(shown) {
  const total = state.all.length;
  const n = shown ?? total;
  const noPin = state.all.filter(r => r.lat == null).length;
  let txt = state.reco ? `${n} recomendaciones de ${total} restaurantes`
    : n === total ? `${total} restaurantes` : `${n} de ${total} restaurantes`;
  if (noPin) txt += `. ${noPin} sin coordenadas`;
  if (state.loadedAt) txt += `. Datos de las ${state.loadedAt}, <button type="button" onclick="load()">actualizar</button>`;
  setStatus(txt);
}

const cap = t => t.charAt(0).toUpperCase() + t.slice(1).toLowerCase();

function fillSelect(id, values, current, allLabel) {
  const freq = new Map();
  for (const v of values) {
    const k = norm(v);
    if (!k) continue;
    if (!freq.has(k)) freq.set(k, { label: v, n: 0 });
    freq.get(k).n++;
  }
  const opts = [...freq.entries()].sort((a, b) => b[1].n - a[1].n || a[1].label.localeCompare(b[1].label, "es"));
  const sel = document.getElementById(id);
  sel.innerHTML = `<option value="">${allLabel}</option>` +
    opts.map(([k, v]) => `<option value="${esc(k)}">${esc(v.label)} (${v.n})</option>`).join("");
  sel.value = freq.has(current) ? current : "";
  return sel.value;
}

function buildFilters() {
  state.city = fillSelect("f-city", state.all.map(r => r.city), state.city, "Todas");
  state.style = fillSelect("f-style", state.all.flatMap(r => r.tags.map(cap)), state.style, "Todos");
  syncFilterUI();
}

function syncFilterUI() {
  const on = { "f-city": state.city, "f-style": state.style, "f-score": state.score };
  for (const [id, v] of Object.entries(on)) document.getElementById(id).classList.toggle("on", !!v);
  document.getElementById("clear").hidden = !(state.city || state.style || state.score || state.q);
}

function filtered() {
  const q = norm(state.q);
  const min = state.score === "" ? null : Number(state.score);
  const out = state.all.filter(r =>
    (!q || r.search.includes(q)) &&
    (!state.city || norm(r.city) === state.city) &&
    (!state.style || r.tags.some(t => norm(t) === state.style)) &&
    (min == null ||
      (min < 0 ? r.score != null && r.score < -min : r.score != null && r.score >= min))
  );
  if (state.sort === "score") out.sort((a, b) => (b.score ?? -1) - (a.score ?? -1) || a.name.localeCompare(b.name, "es"));
  else if (state.sort === "city") out.sort((a, b) => a.city.localeCompare(b.city, "es") || (b.score ?? -1) - (a.score ?? -1));
  else out.sort((a, b) => a.name.localeCompare(b.name, "es"));
  return out;
}

function popupHTML(r) {
  const dir = `https://www.google.com/maps/dir/?api=1&destination=${r.lat},${r.lng}`;
  return `<div class="pop">
    <h3>${esc(r.name)}</h3>
    ${r.style ? `<p>${esc(r.style)}</p>` : ""}
    ${r.location ? `<p>${esc(r.location)}</p>` : ""}
    <p>Puntaje: <strong style="color:var(--ink)">${fmtScore(r.score)}</strong></p>
    <a href="${dir}" target="_blank" rel="noopener">Cómo llegar</a>
  </div>`;
}

function recoHeader(reco) {
  const head = document.createElement("div");
  head.className = "reco-head";
  head.innerHTML = `
    <h2>Te recomiendo</h2>
    ${reco.chips.length ? `<div class="chips">${reco.chips.map(c => `<span>${esc(c)}</span>`).join("")}</div>` : ""}
    ${reco.notes.map(n => `<p class="note">${esc(n)}</p>`).join("")}
    <button type="button" class="back">Ver todos los restaurantes</button>`;
  head.querySelector(".back").addEventListener("click", () => {
    state.reco = null;
    document.getElementById("ask-q").value = "";
    render(true);
  });
  return head;
}

function render(fit) {
  const rows = state.reco ? state.reco.rows : filtered();
  const list = document.getElementById("list");
  layer.clearLayers();
  markers.clear();
  list.innerHTML = "";
  // En modo recomendación los filtros no aplican: se ocultan para dar espacio a los resultados
  document.querySelector(".controls").hidden = !!state.reco;
  document.querySelector(".examples").hidden = !!state.reco;
  if (state.reco) list.appendChild(recoHeader(state.reco));

  if (!rows.length) {
    if (state.reco) { updateStatus(0); return; }
    list.innerHTML = state.all.length
      ? `<div class="empty"><strong>Ningún restaurante coincide.</strong>Prueba otra combinación o pulsa «Quitar filtros».</div>`
      : `<div class="empty"><strong>La hoja está vacía.</strong>Agrega restaurantes en la hoja y pulsa actualizar.</div>`;
    updateStatus(0);
    return;
  }

  const frag = document.createDocumentFragment();
  for (const r of rows) {
    if (r.lat != null) {
      const m = L.marker([r.lat, r.lng], { icon: pinIcon(r), title: r.name }).bindPopup(popupHTML(r));
      m.on("click", () => highlight(r.id, true));
      markers.set(r.id, m);
    }

    const b = document.createElement("button");
    b.type = "button";
    b.className = "item" + (state.activeId === r.id ? " active" : "");
    b.dataset.id = r.id;
    b.innerHTML = `
      <span class="score" style="background:${tier(r.score)}">${fmtScore(r.score)}</span>
      <span>
        <p class="name">${esc(r.name)}</p>
        <p class="meta">${esc([r.style, r.location].filter(Boolean).join(", "))}</p>
        ${state.reco && state.reco.why(r) ? `<p class="why">${esc(state.reco.why(r))}</p>` : ""}
        ${r.lat == null ? `<p class="nopin">Sin coordenadas en la hoja</p>` : ""}
      </span>`;
    b.addEventListener("click", () => {
      highlight(r.id, false);
      const m = markers.get(r.id);
      if (!m) return;
      map.closePopup();
      // Vuela hasta el pin y, si quedó dentro de un grupo, lo abre para mostrarlo
      if (pendingFly) map.off("moveend", pendingFly);
      pendingFly = () => { pendingFly = null; layer.zoomToShowLayer(m, () => m.openPopup()); };
      map.once("moveend", pendingFly);
      map.flyTo(m.getLatLng(), 16, { duration: 0.6 });
    });
    frag.appendChild(b);
  }
  list.appendChild(frag);
  layer.addLayers([...markers.values()]);
  updateStatus(rows.length);

  if (fit) fitView(rows);
}

function highlight(id, scroll) {
  state.activeId = id;
  document.querySelectorAll(".item").forEach(el => el.classList.toggle("active", Number(el.dataset.id) === id));
  if (scroll) document.querySelector(`.item[data-id="${id}"]`)?.scrollIntoView({ block: "nearest", behavior: "smooth" });
}

function ask(text) {
  if (!text.trim() || !state.all.length) return;
  state.reco = recommend(text);
  state.activeId = null;
  render(true);
  document.getElementById("list").scrollTop = 0;
}
document.getElementById("ask").addEventListener("submit", e => {
  e.preventDefault();
  ask(document.getElementById("ask-q").value);
});
document.querySelectorAll(".examples button").forEach(b => b.addEventListener("click", () => {
  document.getElementById("ask-q").value = b.textContent;
  ask(b.textContent);
}));

// Tocar la búsqueda o un filtro sale del modo recomendación
let t;
document.getElementById("q").addEventListener("input", e => {
  clearTimeout(t);
  t = setTimeout(() => { state.q = e.target.value; state.reco = null; syncFilterUI(); render(true); }, 150);
});
for (const [id, key] of [["f-city", "city"], ["f-style", "style"], ["f-score", "score"]]) {
  document.getElementById(id).addEventListener("change", e => { state[key] = e.target.value; state.reco = null; syncFilterUI(); render(true); });
}
document.getElementById("clear").addEventListener("click", () => {
  Object.assign(state, { city: "", style: "", score: "", q: "", reco: null });
  document.getElementById("q").value = "";
  ["f-city", "f-style", "f-score"].forEach(id => (document.getElementById(id).value = ""));
  syncFilterUI();
  render(true);
});
document.getElementById("sort").addEventListener("change", e => { state.sort = e.target.value; render(false); });

load();
</script>
</body>
</html>
